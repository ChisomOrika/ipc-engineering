name: IPC Incremental Ingestion

on:
  schedule:
    - cron: '30 4 * * *'   # 05:30 WAT → finishes ~05:50 WAT → data ready before 8am
    - cron: '30 10 * * *'  # 11:30 WAT → midday refresh
    - cron: '30 16 * * *'  # 17:30 WAT → finishes ~17:50 WAT → data ready before 7pm
    - cron: '30 22 * * *'  # 23:30 WAT → overnight refresh
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Kill if something hangs

    env:
      PG_HOST:             ${{ secrets.PG_HOST }}
      PG_PORT:             ${{ secrets.PG_PORT }}
      PG_USER:             ${{ secrets.PG_USER }}
      PG_PASSWORD:         ${{ secrets.PG_PASSWORD }}
      9JAPAY_SECRET:       ${{ secrets.NINEPAY_SECRET }}
      9JAPAY_API_KEY:      ${{ secrets.NINEPAY_API_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      LENCO_API_TOKEN:     ${{ secrets.LENCO_API_TOKEN }}
      DASH_URL:            ${{ secrets.DASH_URL }}
      GOSOURCE_URL:        ${{ secrets.GOSOURCE_URL }}
      DO_API_TOKEN:        ${{ secrets.DO_API_TOKEN }}
      DO_DASH_DB_ID:       ${{ secrets.DO_DASH_DB_ID }}
      DO_GOSOURCE_DB_ID:   ${{ secrets.DO_GOSOURCE_DB_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary pymongo pandas python-dotenv requests urllib3 dbt-postgres certifi

      # ─────────────────────────────────────────────────────────────────────
      # Whitelist this runner's IP on the DO Mongo clusters so the DAASH and
      # GoSource MongoDB ingestions can connect. Every GH Actions runner has
      # a different IP, so we add it here, run the ingestions, and always
      # remove it afterward (even on failure — see the cleanup step).
      #
      # Uses DO API: https://docs.digitalocean.com/reference/api/api-reference/#tag/Databases
      # We add the IP as a "trusted source" on each cluster's firewall.
      # ─────────────────────────────────────────────────────────────────────
      - name: Detect runner IP
        id: runner_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $IP"

      - name: Whitelist runner IP on DO Mongo clusters
        env:
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
        run: |
          set -e
          for DB_ID in "$DO_DASH_DB_ID" "$DO_GOSOURCE_DB_ID"; do
            # Fetch existing rules, append this runner's IP, PUT back.
            EXISTING=$(curl -s -H "Authorization: Bearer $DO_API_TOKEN" \
              "https://api.digitalocean.com/v2/databases/$DB_ID/firewall" \
              | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([{'type':r['type'],'value':r['value']} for r in d.get('rules',[])]))")
            NEW_RULES=$(python -c "
          import json, os
          existing = json.loads(os.environ['EXISTING'])
          existing.append({'type':'ip_addr','value':os.environ['RUNNER_IP']})
          print(json.dumps({'rules': existing}))
          " EXISTING="$EXISTING")
            curl -s -X PUT -H "Authorization: Bearer $DO_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$NEW_RULES" \
              "https://api.digitalocean.com/v2/databases/$DB_ID/firewall" \
              | python -c "import sys,json; d=json.load(sys.stdin); print('Whitelist response:', d.get('rules', d))"
          done
          # Mongo trust-list changes take a few seconds to propagate.
          sleep 15

      - name: DAASH ingestion
        run: python ipc_ingestion/dash_incremental_load.py

      - name: GoSource ingestion
        run: python ipc_ingestion/gosource_incremental_load.py

      # Always attempt to clean up the runner IP from the firewalls, even if
      # the ingestion steps above failed. Not strictly required (rules decay
      # harmlessly as IPs change) but keeps the firewall lists tidy.
      - name: Remove runner IP from DO Mongo firewalls
        if: always() && steps.runner_ip.outputs.ip != ''
        env:
          RUNNER_IP: ${{ steps.runner_ip.outputs.ip }}
        run: |
          set +e
          for DB_ID in "$DO_DASH_DB_ID" "$DO_GOSOURCE_DB_ID"; do
            EXISTING=$(curl -s -H "Authorization: Bearer $DO_API_TOKEN" \
              "https://api.digitalocean.com/v2/databases/$DB_ID/firewall" \
              | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([{'type':r['type'],'value':r['value']} for r in d.get('rules',[])]))")
            CLEANED=$(python -c "
          import json, os
          existing = json.loads(os.environ['EXISTING'])
          filtered = [r for r in existing if r['value'] != os.environ['RUNNER_IP']]
          print(json.dumps({'rules': filtered}))
          " EXISTING="$EXISTING")
            curl -s -X PUT -H "Authorization: Bearer $DO_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$CLEANED" \
              "https://api.digitalocean.com/v2/databases/$DB_ID/firewall" > /dev/null
          done
          echo "Runner IP cleaned up from both firewalls."

      - name: Lenco ingestion
        run: python ipc_ingestion/lenco_incremental_load.py

      - name: Paystack ingestion
        run: python ipc_ingestion/paystack_incremental_load.py

      - name: 9japay ingestion
        run: python ipc_ingestion/9japay_incremental_load.py

      - name: Run dbt transformations
        run: |
          cd ipc_transform
          dbt run --profiles-dir .

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":red_circle: *IPC Ingestion Failed*\n*Run:* ${{ github.run_number }}\n*Triggered:* ${{ github.event_name }}\n*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "⚠️ IPC ingestion failed — run #${{ github.run_number }}"
          to: ${{ secrets.SMTP_TO }}
          from: IPC Pipeline <${{ secrets.SMTP_USER }}>
          body: |
            IPC ingestion pipeline failed.

            Workflow: ${{ github.workflow }}
            Run:      ${{ github.run_number }}
            Trigger:  ${{ github.event_name }}
            Logs:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
